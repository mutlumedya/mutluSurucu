name: Sync Channels from Firebase

on:
  schedule:
    # Her 1 saatte bir çalışır (UTC)
    - cron: '0 * * * *'
  workflow_dispatch:  # Manuel çalıştırma için

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # 5 dakika timeout
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install requests
          
      - name: Create directories
        run: |
          mkdir -p src/lib
          
      - name: Run sync script
        run: |
          python sync_channels.py
          
      - name: Check if file changed
        id: check_changes
        run: |
          git status --porcelain
          if git diff --staged --quiet && git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
          
      - name: Commit and push if changed
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/lib/multipleChannelData.js
          git commit -m "🔄 Kanal listesi güncellendi [skip ci]"
          git push

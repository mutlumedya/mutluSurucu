name: Sync Channels from Firebase

on:
  schedule:
    # Her 1 saatte bir çalışır (UTC)
    - cron: '0 * * * *'
  workflow_dispatch:  # Manuel çalıştırma için

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install requests schedule
          
      - name: Create directories
        run: |
          mkdir -p src/lib
          
      - name: Run sync script
        run: |
          python sync_channels.py
          
      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/lib/multipleChannelData.js
          git diff --staged --quiet || git commit -m "🔄 Kanal listesi güncellendi [skip ci]"
          git push

name: Sync Channels from Firebase

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install requests
          
      - name: Create directories
        run: |
          mkdir -p src/lib
          
      - name: Run sync script
        run: |
          python sync_channels.py
          
      - name: Check and commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Değişiklikleri kontrol et
          if git status --porcelain | grep -q "src/"; then
            echo "📝 Değişiklik var, commit yapılıyor..."
            git add src/
            git commit -m "🔄 Kanal listesi güncellendi [skip ci]"
            git push
          else
            echo "✅ Değişiklik yok, commit gerekmez."
          fi
